name: Verify

# Runs the repository's own verify command on every pull request, whatever its
# base branch, so agent and Dependabot pull requests prove themselves before
# anyone reviews them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The docs freshness check compares against the merge base with main, so it needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The mods check validates and tests claude/mods/ with the Claude Code CLI itself.
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      # The segwi-e2e check drives the web app in Playwright's Chromium. The browser
      # must match the playwright-core the web app's lockfile pins, so that version
      # keys the cache and runs the install; npx fetches it on its own, leaving the
      # web app's dependencies to the segwi-web check, which installs them from its
      # lockfile during verify.
      - id: playwright
        run: echo "version=$(node -p 'require("./scripts/segwi/web/package-lock.json").packages["node_modules/playwright-core"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # --with-deps installs the system libraries even on a cache hit, when the
      # browser download itself is skipped.
      - run: npx -y "playwright-core@$PLAYWRIGHT_VERSION" install --with-deps chromium
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
      # segwi's sandbox test runs a real run inside bubblewrap, which needs socat for
      # its network proxy and unprivileged user namespaces, which Ubuntu 24.04's
      # AppArmor restricts by default.
      - run: |
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The rendered-qa browser test still skips itself here: it resolves Playwright
      # from the npx cache of the pinned @playwright/mcp or from the repository root,
      # and CI has neither, whatever Chromium is installed.
      # SEGWI_REQUIRE_SANDBOX_TEST makes the sandbox test fail rather than skip when
      # the sandbox is unavailable, so CI always proves it.
      - run: npm run verify
        env:
          SEGWI_REQUIRE_SANDBOX_TEST: "1"
